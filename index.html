<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tiệm Tạp Hóa Ký Ức - Cô Chủ Tiệm</title>
  <style>
    :root {
      --wall: #f6e7c1;
      --card: #fffaf0;
      --wood-dark: #5c3416;
      --wood-mid: #854d27;
      --wood-light: #cfa06e;
      --ink: #3b2314;
      --green: #1f7a38;
      --amber: #b45309;
      --red: #b91c1c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #2b1a0e;
      color: var(--ink);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: var(--wall);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 28px rgba(0,0,0,0.55);
    }
    .roof {
      height: 16px;
      background: repeating-linear-gradient(90deg, #b83b2b 0 24px, #92291c 24px 48px);
      border-bottom: 3px solid var(--wood-dark);
    }
    .header {
      background: linear-gradient(180deg, #fdf3d7, #edd49d);
      border-bottom: 3px solid var(--wood-dark);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .shop-title { font-size: 15px; font-weight: 900; color: #8b1e16; line-height: 1.15; }
    .shop-sub { font-size: 11px; font-weight: 700; color: var(--wood-dark); }
    .top-actions { display: flex; gap: 5px; flex-wrap: wrap; }

    .btn {
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--wood-mid);
      border-radius: 9px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--wood-dark);
    }
    .btn:active { transform: translateY(2px); box-shadow: none; }
    .btn.green { background: #1f7a38; color: #fff; border-color: #124d22; }
    .btn.amber { background: #d97706; color: #fff; border-color: #78350f; }
    .btn.red { background: #b91c1c; color: #fff; border-color: #7f1d1d; }
    .btn.active { background: var(--wood-dark); color: #fff8e7; }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      padding: 6px 8px;
      background: var(--wood-dark);
      color: #fff8e7;
    }
    .hud-box {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 4px 5px;
      text-align: center;
    }
    .hud-k { font-size: 9px; opacity: 0.85; font-weight: 700; }
    .hud-v { font-size: 12px; font-weight: 900; margin-top: 1px; }

    .banner {
      margin: 7px 8px 0;
      padding: 6px 9px;
      border-radius: 10px;
      background: #fffbeb;
      border: 1.5px solid #d97706;
      font-size: 11px;
      font-weight: 700;
      color: #78350f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .banner.paused {
      background: #fef3c7;
      border-color: #b45309;
      color: #92400e;
    }

    .section {
      margin: 8px;
      background: var(--card);
      border: 2px solid var(--wood-dark);
      border-radius: 13px;
      padding: 8px;
      box-shadow: 0 2px 0 rgba(92,52,22,0.2);
    }
    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    /* Cô chủ tiệm đứng giữa khi chưa bày hàng */
    .empty-shop-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: linear-gradient(180deg, #fffdf7, #f5e2bc);
      border: 2px dashed var(--wood-mid);
      border-radius: 12px;
      padding: 12px 10px;
      gap: 7px;
    }
    .owner-svg {
      width: 100px;
      height: 100px;
      animation: ownerBob 2.1s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes ownerBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .owner-bubble {
      background: #fff;
      border: 2px solid var(--wood-dark);
      border-radius: 12px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 800;
      max-width: 370px;
    }

    /* Khách hàng */
    .customer-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .face-box {
      width: 86px;
      min-width: 86px;
      background: #fdf2d6;
      border: 2px solid var(--wood-dark);
      border-radius: 12px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .face-svg { width: 64px; height: 64px; }
    .voice-tag {
      font-size: 9px;
      font-weight: 900;
      background: #fde68a;
      border: 1px solid #d97706;
      border-radius: 99px;
      padding: 1px 6px;
      margin-top: 2px;
    }
    .cust-info { flex: 1; min-width: 0; }
    .order-say { font-size: 12px; font-weight: 800; margin: 3px 0 5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .chip {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 99px;
      background: #f4e4c4;
      border: 1.5px solid var(--wood-mid);
      cursor: pointer;
    }
    .chip.ok { background: #dcfce7; border-color: #15803d; color: #166534; }

    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
    }
    .bar {
      flex: 1;
      height: 8px;
      background: #e7d5b5;
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--wood-mid);
    }
    .bar-fill { height: 100%; background: #22c55e; transition: width 0.15s linear; }
